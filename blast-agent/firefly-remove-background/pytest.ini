[pytest]
testpaths = specs
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui:          marquee/upload-block layout & copy tests (MWPW-200902)
    upload:      image upload behaviour (click, drag-drop, progress)
    error:       invalid-upload error handling
    redirect:    cross-app handoff to the Firefly product app
    smoke:       critical-path smoke tests
    compat:      cross-browser compatibility tests
    mobile:      mobile viewport tests
    integration: API integration / network tests
    a11y:        baseline accessibility tests

addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
