[pytest]
testpaths = specs
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke:  critical path — run first
    ui:     UI structure and visual correctness tests (MWPW-199796)

addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
