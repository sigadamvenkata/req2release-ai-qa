[pytest]
testpaths = specs
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
markers =
    ui:          Full UI coverage tests (@ui)
    smoke:       Critical path smoke tests (@smoke)
    heading:     Heading validity tests
    layout:      Grid and layout tests
    metadata:    Card metadata tests
    seo:         SEO and meta tag tests
    critical:    Must-pass gate tests
    functional:  Functional interaction tests
    compat:      Cross-browser compatibility tests
    mobile:      Mobile viewport tests
    integration: Stock API integration tests
    a11y:        Accessibility checks
