[pytest]
testpaths = specs
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
markers =
    placement:    Banner rendering & placement above GNAV (Feature 1)
    delayed_load: Async/delayed banner load behavior (Feature 2)
    states:       Maximized/minimized banner state & content tests (Feature 3)
    countdown:    Promo countdown timer tests (Feature 4)
    theming:      Light/Dark theme tests (Feature 5)
    responsive:   Viewport/responsive layout tests (Feature 6)
    scroll:       Non-sticky scroll behavior tests (Feature 7)
    no_dismiss:   No close button / no session persistence tests (Feature 8)
    rtl:          WW rollout / RTL locale tests (Feature 9)
    a11y:         Accessibility tests (Feature 10)
    smoke:        Critical path smoke tests
