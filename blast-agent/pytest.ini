[pytest]
testpaths = tests/specs
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: critical path tests — run first
    seo: SEO and page load tests
    navigation: Global Navigation CTA tests
    marquee: Marquee/hero section tests
    upload: Image upload tests
    error: Error handling tests
    accordion: Accordion/FAQ block tests
    skip_auth: Requires logged-in Adobe account — skipped in this run

# Reporting
addopts =
    -v
    --tb=short
    --html=tests/reports/report.html
    --self-contained-html
    --alluredir=tests/reports/allure-results
