[pytest]
testpaths = specs
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke:        critical-path smoke tests (MWPW-199796)
    functional:   hover/click behaviour tests
    compat:       cross-browser compatibility tests
    mobile:       mobile viewport tests
    integration:  API integration tests

addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    --alluredir=reports/allure-results
